<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Rød bil med L-skilt">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e23b46"/>
      <stop offset="1" stop-color="#b00f1c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4150"/>
      <stop offset="1" stop-color="#262b35"/>
    </linearGradient>
  </defs>

  <!-- hvit medaljong -->
  <circle cx="160" cy="160" r="150" fill="#ffffff"/>
  <circle cx="160" cy="160" r="150" fill="none" stroke="#f1e9eb" stroke-width="2"/>

  <!-- bakkeskygge -->
  <ellipse cx="172" cy="258" rx="120" ry="15" fill="#1c080c" opacity=".10"/>

  <!-- bilkropp -->
  <path d="M58 206 C58 184 70 176 88 174 L108 142 C114 132 124 126 136 126 H206
           C220 126 232 134 238 146 L252 174 C272 178 286 188 286 206 L286 214
           C286 220 281 224 275 224 H69 C63 224 58 220 58 214 Z"
        fill="url(#body)"/>
  <!-- karosserilinje / glans -->
  <path d="M66 196 H280" stroke="#ffffff" stroke-width="3" opacity=".18" stroke-linecap="round"/>

  <!-- vinduer -->
  <path d="M118 146 C121 140 127 138 134 138 H168 V170 H106 Z" fill="url(#glass)"/>
  <path d="M178 138 H202 C209 138 215 142 219 148 L230 170 H178 Z" fill="url(#glass)"/>
  <path d="M170 138 V170" stroke="#8a0d18" stroke-width="3" opacity=".55"/>

  <!-- dørhåndtak -->
  <rect x="150" y="184" width="22" height="6" rx="3" fill="#7d0a14" opacity=".7"/>

  <!-- frontlys -->
  <ellipse cx="279" cy="197" rx="8" ry="6" fill="#ffe39b"/>

  <!-- hjul -->
  <circle cx="108" cy="224" r="29" fill="#23272f"/>
  <circle cx="108" cy="224" r="14" fill="#e9ebef"/>
  <circle cx="108" cy="224" r="29" fill="none" stroke="#c01524" stroke-width="3"/>
  <circle cx="236" cy="224" r="29" fill="#23272f"/>
  <circle cx="236" cy="224" r="14" fill="#e9ebef"/>
  <circle cx="236" cy="224" r="29" fill="none" stroke="#c01524" stroke-width="3"/>

  <!-- L-skilt -->
  <g transform="translate(160 86)">
    <rect x="-27" y="-27" width="54" height="54" rx="11" fill="#fff" stroke="#e6dfe1" stroke-width="2"/>
    <path d="M-7 -16 V14 H14" fill="none" stroke="#c01524" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
